name: Build CinemaHub APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "Checking Android project structure..."

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
            exit 1
          fi

          echo "Android project structure OK."

      - name: Show Java version
        run: java -version

      - name: Show Gradle version
        run: gradle --version

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find app/build/outputs/apk -type f -name "*.apk" -print

          APK_COUNT=$(find app/build/outputs/apk -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK successfully generated."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CinemaHub-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "debug-${{ github.run_number }}"
          name: "CinemaHub Debug APK #${{ github.run_number }}"
          generate_release_notes: true
          files: app/build/outputs/apk/**/*.apk
